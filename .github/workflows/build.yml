# Note: the browser (net10-browser, WASM) target is intentionally not run
# here yet. Runner/Platforms/browser-host drives it headlessly via
# Microsoft.Playwright against a `dotnet publish` of Runner/Platforms/browser
# -- see that project's Program.cs for usage -- but automating that in CI is
# left for a follow-up once it's been proven out on a real runner.
#
# Coverage: uses Microsoft's dotnet-coverage global tool (successor to the
# old CoverageRunner project, which never actually collected coverage
# itself -- see WhoTestsTheTesters/Readme.md's history -- it just gave an
# external profiler something simple to launch). `dotnet-coverage collect`
# wraps the net10-runner test run and instruments the whole process tree.
# The command shape here is confirmed correct against the tool's own
# --help, but wasn't verified end-to-end on every platform before this was
# committed (local profiler attach failed in one dev environment with "no
# code coverage data available. Profiler was not initialized" -- watch the
# first few runs of this step across the OS matrix to confirm it actually
# produces non-empty reports).
name: build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build AnyUnit.slnx --configuration Release

      # net10-runner exits non-zero whenever a test assembly has any
      # Fail/Error results - which AnyUnit's self-test assemblies always do,
      # on purpose (see the "Verify results match naming convention" step
      # below). That exit code is meaningful for a one-off local run, but
      # here it would (under `set -e`) abort this script after the first
      # assembly, so each invocation is `|| true`d - the real pass/fail
      # gate is ConventionTestProcessor, not this runner's exit code.
      - name: Run tests through the net10 console runner, with coverage
        shell: bash
        run: |
          set -e
          dotnet tool install --global dotnet-coverage
          dotnet-coverage collect --output coverage.cobertura.xml --output-format cobertura -- \
            bash -c '
              set -e
              run() {
                dotnet run --project Runner/Platforms/net10/net10-runner.csproj --configuration Release --no-build -- \
                  run -o "/tmp/$1-net10.json" "WhoTestsTheTesters/Tests/$2/bin/Release/netstandard2.0/$1.dll" || true
              }
              run BasicTests BasicTests
              run ConstraintsTests ConstraintsTests
              run NunitTests Style/NunitTests
              run XunitTests Style/XunitTests
              run FsUnitTests Style/FsUnitTests
            '

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.cobertura.xml

      - name: Run tests through the net48 console runner (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          run() {
            dotnet run --project Runner/Platforms/net48/net48-runner.csproj --configuration Release --no-build -- \
              run -o "/tmp/$1-net48.json" "WhoTestsTheTesters/Tests/$2/bin/Release/netstandard2.0/$1.dll" || true
          }
          run BasicTests BasicTests
          run ConstraintsTests ConstraintsTests
          run NunitTests Style/NunitTests
          run XunitTests Style/XunitTests
          run FsUnitTests Style/FsUnitTests

      # AnyUnit's self-test assemblies deliberately contain failing/erroring/
      # ignored tests (a "_Fail"-suffixed test is supposed to fail, an
      # "_Opposite"-prefixed one inverts that, etc. - see
      # WhoTestsTheTesters/ConventionTestProcessor). This is the real
      # pass/fail gate: it checks every result's actual outcome against what
      # its own name declares, rather than eyeballing raw counts.
      - name: Verify results match naming convention
        shell: bash
        run: |
          set -e
          dotnet run --project WhoTestsTheTesters/ConventionTestProcessor/ConventionTestProcessor.csproj --configuration Release --no-build -- /tmp/*.json
