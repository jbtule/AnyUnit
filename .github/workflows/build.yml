# Coverage runs as its own separate job (not part of the build-and-test
# matrix): the managed code under test is the same regardless of which OS
# it happens to run on, so measuring coverage three times over (once per
# matrix OS) would just be the same numbers three times, not three
# different pieces of information the way the matrix's actual pass/fail
# results are. See that job's own comment for why coverlet.console
# specifically.
#
# The wasm (browser) target also runs as its own separate job, not part
# of the OS matrix: it works the same way regardless of host OS (the
# actual test execution happens inside a headless Chromium PuppeteerSharp
# drives, not the host's own runtime), and building browser-wasm-runner-host (a
# Blazor WASM app needing the wasm-tools workload and an Emscripten
# native-link step) is slow enough that repeating it per matrix OS would
# be pure waste, same reasoning as the coverage job. build-and-test and
# coverage build AnyUnit.ci.slnf (a solution filter over AnyUnit.slnx)
# rather than the solution directly, specifically to exclude browser-wasm-runner/
# browser-wasm-runner-host from their build - browser-wasm-runner's own build fails
# outright unless browser-wasm-runner-host has already been published (see
# browser-wasm-runner.csproj's CheckBrowserWasmRunnerHostPublished target), so building
# the full, unfiltered solution here would force that slow Emscripten
# step onto every one of those jobs too. test-browser-wasm builds the real,
# unfiltered AnyUnit.slnx (after publishing browser-wasm-runner-host itself),
# since it's the one job that actually needs browser-wasm-runner built.
#
# test-aot-mtp is likewise its own single-OS job: BasicTests.Mtp
# published with Native AOT and run as a native executable - the one leg
# where AnyUnit itself is trimmed and compiled ahead of time rather than
# JIT-compiled (see that job's own comment for what it catches).
#
# `pack` builds every NuGet package this repo ships and uploads the
# .nupkg files as a workflow artifact, on every run - not gated behind
# a release tag, specifically so a prerelease package (MinVer versions
# an untagged build as e.g. 1.0.0-alpha.0.<height>) is always available
# to grab and test without cutting a release first. See that job's own
# comment for why it also covers the real, tagged-release version with
# no separate job needed for that case.
name: build

on:
  push:
    # Not every branch: a branch with an open PR would otherwise run
    # this workflow twice for the same commit - once for the push
    # event, once for the pull_request event's synchronize. Restricting
    # push to the default branch means a feature branch's own pushes
    # are covered by pull_request alone (once a PR exists), and master
    # still gets its own push-triggered run after a PR merges. tags is
    # additive here (branches/tags combine with OR, not AND) - needed
    # so pushing a release tag still triggers this workflow (in
    # particular the pack job, so a tagged release gets the real
    # MinVer-computed version, not just the untagged/prerelease one).
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

# For a pull_request event, actions/checkout defaults to the synthetic
# refs/pull/<PR>/merge commit (this branch merged into its base), not
# this branch's own tip - its history includes the base branch's, which
# throws off MinVer's git-tag-based versioning (pack job): a tag that's
# only reachable via the base branch becomes reachable through the
# merge commit too, and if it happens to be closer than any tag on this
# branch's own history, MinVer computes the version from THAT tag
# instead - different, not reproducible locally, and liable to shift on
# its own if the base branch moves, with no new commits on this branch
# at all (confirmed: happened for real - a PR run produced
# 1.0.0-alpha.0.2 off v0.9.0-wip, a tag that only exists on master,
# while every local build off this branch's own tip computed
# 1.0.0-alpha.0.<much higher>, off v0.8.0-alpha instead). Checking out
# the actual PR head commit instead sidesteps this for every job, not
# just pack - matching what actually gets tested to the commit a
# reviewer is looking at, not a preview merge nothing else reproduces.
env:
  CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Real hosted runners for every arch .NET actually ships a
        # runtime for (see release.yml for the RIDs that have no hosted
        # runner at all - win-x86, linux-arm - and so can only ever be
        # cross-published, never executed in CI).
        os:
          - ubuntu-latest      # linux-x64
          - ubuntu-24.04-arm   # linux-arm64
          - windows-latest     # win-x64
          - windows-11-arm     # win-arm64
          - macos-latest       # osx-arm64 (Apple Silicon)
          - macos-15-intel     # osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # AnyUnit.ci.slnf builds everything EXCEPT browser-wasm-runner/
      # browser-wasm-runner-host (see the top-of-file comment: browser-wasm-runner's own
      # build errors out unless browser-wasm-runner-host is published first, and
      # that publish - an Emscripten native-link step - is too slow to
      # repeat across 6 matrix legs + coverage; test-browser-wasm builds the full
      # solution instead, once).
      - name: Build
        run: dotnet build AnyUnit.ci.slnf --configuration Release

      - name: Run tests through the net10 console runner
        shell: bash
        run: .github/scripts/run-tests.sh Runner/Platforms/net10/bin/Release/net10.0/anyunit-runner.dll net10

      # Exercises the MTP ITrxReportCapability wiring for real
      # (AnyUnit.TestingPlatform/AnyUnitTrxReportCapability.cs +
      # Runner.TryAddTrxReportProvider): BasicTests.Mtp references
      # Microsoft.Testing.Extensions.TrxReport itself (see that csproj's
      # own comment on why), so the "report-trx" flag should produce a
      # real, well-formed .trx - not just parse as a recognized flag.
      # Same "always non-zero, only the output matters" reasoning as
      # run-tests.sh (BasicTests always contains real Fail/Error cases).
      - name: Run BasicTests.Mtp with the report-trx flag and verify output
        shell: bash
        run: |
          set -e
          # A relative path, not /tmp/... : on Windows, git-bash's MSYS
          # layer auto-converts a whole argument that looks like a POSIX
          # path (e.g. dotnet's own --results-directory /tmp/trx-check)
          # into a real Windows path before the native .NET/Python
          # processes ever see it - but NOT a path embedded as a substring
          # inside a larger argument, like `$trx` interpolated into
          # python3's -c script below. That mismatch (dotnet writes to
          # the auto-translated real path; python3 gets the literal,
          # untranslated string) is a confirmed real failure on Windows
          # CI (FileNotFoundError: '/tmp/trx-check/....trx'). A relative
          # directory has no leading "/" to trigger that heuristic at
          # all, so bash, dotnet.exe, and python3.exe all resolve it
          # identically against the same cwd.
          dotnet WhoTestsTheTesters/Tests/BasicTests.Mtp/bin/Release/net10.0/BasicTests.dll \
            --report-trx --results-directory trx-check || true
          trx=$(ls trx-check/*.trx)
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('$trx')"

      # The step above is a TRX-plumbing check, not a conformance one: it
      # proves a .trx came out and parses as XML, which says nothing about
      # whether the MTP path reported the RIGHT outcome for any given test.
      # Until AnyUnit.TestingPlatform grew --report-anyunit-json that was
      # the only check the 8 *.Mtp projects got at all - they produced
      # nothing ConventionTestProcessor could read, so the one real gate in
      # this repo simply didn't cover the MTP leg.
      #
      # These land in /tmp beside run-tests.sh's own output, so the "Verify
      # results match naming convention" step further down picks them up
      # through its existing /tmp/*.json glob with no change of its own -
      # and so does "Stage results for upload", which feeds convention-
      # summary. There they show up as their own platform rather than
      # merging into the console runner's, because run-mtp-tests.sh
      # passes --platform-suffix mtp.
      - name: Run every *.Mtp project through MTP and write AnyUnit JSON
        shell: bash
        run: .github/scripts/run-mtp-tests.sh net10-mtp

      # Round-trips the MTP-produced JSON back out through anyunit-report.
      # A file that ConventionTestProcessor accepts isn't automatically one
      # AnyUnit.Report can read: they use different readers (a hand-rolled
      # System.Text.Json pass vs Report/ResultsFileReader.cs, which also
      # enforces the Tool marker and SchemaVersion). html specifically
      # because its writer walks the whole Assemblies/Fixtures/Tests/
      # Results tree including the Platforms list, so a structurally
      # wrong file fails here rather than quietly producing less output.
      - name: Convert the MTP results through anyunit-report
        shell: bash
        run: |
          set -e
          dotnet Report/bin/Release/net10.0/anyunit-report.dll convert \
            -f html -o mtp-report.html /tmp/*-net10-mtp.json
          test -s mtp-report.html

      # net48-runner needs an explicit -p:Platform build per bitness
      # (classic .NET Framework has no RuntimeIdentifier/self-contained
      # deployment model - bitness is a PE-header PlatformTarget, not
      # something one build can produce both variants of). The generic
      # solution-wide build step above still also produces an unused,
      # unsuffixed net48-runner.exe (falls through both platform-
      # conditioned property groups when no Platform is specified) -
      # harmless, just not one of these two. Runs on windows-11-arm too
      # (runner.os == 'Windows' covers both) - .NET Framework itself only
      # ships x86/x64 builds, but Windows-on-ARM's built-in x64 emulation
      # should run them; not independently verified on real ARM64 Windows.
      - name: Build net48 console runner (both bitnesses, Windows only)
        if: runner.os == 'Windows'
        run: |
          dotnet build Runner/Platforms/net48/net48-runner.csproj --configuration Release -p:Platform=x86
          dotnet build Runner/Platforms/net48/net48-runner.csproj --configuration Release -p:Platform=x64

      - name: Run tests through the net48 console runner, x86 (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/run-tests.sh Runner/Platforms/net48/bin/x86/Release/net48/anyunit-net48-runner-win32.exe net48-x86

      - name: Run tests through the net48 console runner, x64 (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/run-tests.sh Runner/Platforms/net48/bin/x64/Release/net48/anyunit-net48-runner-win64.exe net48-x64

      # Same RID/host split as release.yml (see its own comment): each
      # matrix leg here publishes whichever self-contained, single-file
      # RID build(s) are "theirs" - a 32-bit RID with no hosted runner
      # of its own rides along on its 64-bit counterpart's leg
      # (win-x86 here, linux-arm on ubuntu-24.04-arm). Actually running
      # the self-test suite through each one - not just release.yml's
      # plain `dotnet publish` - is a real functional check that the
      # self-contained/single-file publish itself works, not just that
      # the framework-dependent build above does. Uploaded as workflow
      # artifacts so they're downloadable straight from this run, same
      # exe names release.yml produces.
      #
      # linux-arm is publish-and-upload only, never actually executed
      # here: confirmed via a real CI failure ("cannot execute: required
      # file not found") that ubuntu-24.04-arm's own aarch64 kernel/
      # userspace can't run a 32-bit armhf binary at all without extra
      # multiarch/qemu-user setup this job doesn't do - unlike win-x86 on
      # windows-latest (x64), where WOW64 runs a 32-bit x86 binary
      # natively with nothing extra needed, so that one still gets the
      # real functional check. The publish/package step itself is still
      # exercised (cross-compiling from any host works fine, per
      # release.yml's own comment) - only the "run it for real" check is
      # skipped, and only for this one RID.
      - name: Publish, test, and upload self-contained RID build(s)
        shell: bash
        run: |
          set -e
          case "${{ matrix.os }}" in
            windows-latest)   rids="win-x64 win-x86" ;;
            windows-11-arm)   rids="win-arm64" ;;
            ubuntu-latest)    rids="linux-x64" ;;
            ubuntu-24.04-arm) rids="linux-arm64 linux-arm" ;;
            macos-latest)     rids="osx-arm64" ;;
            macos-15-intel)   rids="osx-x64" ;;
          esac
          for rid in $rids; do
            dotnet publish Runner/Platforms/net10/net10-runner.csproj -c Release -r "$rid" --self-contained true -p:PublishSingleFile=true -o "publish/$rid"
            if [ -f "publish/$rid/anyunit-runner.exe" ]; then
              exe="publish/$rid/anyunit-runner-$rid.exe"
              mv "publish/$rid/anyunit-runner.exe" "$exe"
            else
              exe="publish/$rid/anyunit-runner-$rid"
              mv "publish/$rid/anyunit-runner" "$exe"
              chmod +x "$exe"
            fi
            if [ "$rid" = "linux-arm" ]; then
              echo "Skipping execution of $exe: 32-bit armhf can't run on this aarch64 host without multiarch/qemu-user support."
            else
              # self-contained: a self-contained single-file publish and
              # this same job's own plain framework-dependent net10 run
              # (further up in this job) can land on the exact same
              # OS/arch/framework (e.g. both "linux-x64" on ubuntu-latest,
              # since PlatformId.Current only knows about those three
              # things, not "self-contained vs framework-dependent") -
              # without this they'd be indistinguishable in the JSON
              # despite being genuinely different builds.
              .github/scripts/run-tests.sh "$exe" "net10-$rid" self-contained
            fi
          done

      - name: Upload self-contained RID build(s)
        uses: actions/upload-artifact@v7
        with:
          name: anyunit-runner-${{ matrix.os }}
          path: publish/*/anyunit-runner-*

      # AnyUnit's self-test assemblies deliberately contain failing/erroring/
      # ignored tests (a "_Fail"-suffixed test is supposed to fail, an
      # "_Opposite"-prefixed one inverts that, etc. - see
      # WhoTestsTheTesters/ConventionTestProcessor). This is the real
      # pass/fail gate: it checks every result's actual outcome against what
      # its own name declares, rather than eyeballing raw counts. Its own Job
      # Summary is suppressed here (ANYUNIT_SKIP_GH_SUMMARY) - convention-summary
      # posts the one consolidated summary across every job's results instead,
      # so this job's own copy would just be a redundant, single-platform
      # subset of it (same reasoning coverage's own step is already excluded
      # for).
      - name: Verify results match naming convention
        shell: bash
        env:
          ANYUNIT_SKIP_GH_SUMMARY: 'true'
        run: |
          set -e
          dotnet run --project WhoTestsTheTesters/ConventionTestProcessor/ConventionTestProcessor.csproj --configuration Release --no-build -- /tmp/*.json

      # actions/upload-artifact is a Node.js action, not bash - on Windows
      # it resolves a literal "/tmp" completely differently than the git-
      # bash MSYS layer every other step here goes through (which is why
      # ConventionTestProcessor's own bash-invoked /tmp/*.json glob just
      # above works fine, but pointing upload-artifact at that same
      # pattern directly does not - confirmed for real: silently found
      # nothing on both Windows legs, "No files were found with the
      # provided path: /tmp/*.json", even on an otherwise fully green
      # run). $RUNNER_TEMP/runner.temp is a real, OS-native absolute path
      # exposed identically to bash and to the action, so copying there
      # first (a plain bash step, same path resolution that already
      # works for /tmp itself) sidesteps the mismatch entirely.
      - name: Stage results for upload
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/anyunit-results"
          cp /tmp/*.json "$RUNNER_TEMP/anyunit-results/" 2>/dev/null || true

      # Uploaded regardless of the gate above (always()) - convention-summary
      # wants every platform's data even when one platform's own gate just
      # failed, so the consolidated view still reflects it too, not a gap.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anyunit-results-${{ matrix.os }}
          path: ${{ runner.temp }}/anyunit-results/*.json
          if-no-files-found: warn

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build AnyUnit.ci.slnf --configuration Release

      # Uses coverlet.console (successor to the old CoverageRunner project,
      # which never actually collected coverage itself -- see
      # WhoTestsTheTesters/Readme.md's history -- it just gave an external
      # profiler something simple to launch). Tried Microsoft's
      # dotnet-coverage global tool first, which works by injecting a live
      # CLR profiler into the target process; that failed locally with
      # "Profiler was not initialized" on macOS with System Integrity
      # Protection enabled (SIP blocks that kind of runtime injection into
      # signed processes -- a known category of limitation for
      # profiler-based tools there, not a bug in this setup). coverlet.
      # console instruments the target assembly's IL statically before
      # running it, so it doesn't need live process injection at all --
      # verified working end-to-end locally (real, non-zero coverage
      # numbers), and being platform-agnostic static instrumentation is
      # exactly why it doesn't matter which single OS runs this job.
      - name: Run tests through the net10 console runner, with coverage
        shell: bash
        run: |
          set -e
          dotnet tool install --global coverlet.console
          coverlet Runner/Platforms/net10/bin/Release/net10.0/anyunit-runner.dll \
            --target "bash" \
            --targetargs ".github/scripts/run-tests.sh Runner/Platforms/net10/bin/Release/net10.0/anyunit-runner.dll net10" \
            --output coverage --format cobertura

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.cobertura.xml

      # dotnet-reportgenerator-globaltool, not a third-party GitHub
      # Action - same "just another dotnet global tool" pattern as
      # coverlet.console itself just above, so this doesn't add a new
      # kind of trust surface to the workflow the way a marketplace
      # summary action would. MarkdownSummaryGithub is a real,
      # purpose-built report type for exactly this (verified locally
      # against a real coverage.cobertura.xml first, not assumed) -
      # collapsible per-assembly/per-class tables, the same aesthetic
      # WhoTestsTheTesters/ConventionTestProcessor/GitHubSummary.cs's
      # own convention-summary output already uses.
      - name: Post coverage summary
        shell: bash
        run: |
          set -e
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:coverage.cobertura.xml -targetdir:coveragereport -reporttypes:MarkdownSummaryGithub
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  test-browser-wasm:
    # ubuntu-latest, not macOS: this job's own dotnet-workload-install
    # step (below) is the one that turned out to be ~15-20x slower on
    # macos-latest than ubuntu-latest for reasons that stayed unknown
    # after three separate fix attempts (see git history on this file -
    # Gatekeeper disable, --skip-manifest-update, manifest purge - all
    # reverted, none helped). Moving here avoids the slow install
    # entirely instead of chasing it further. This job used to be on
    # macOS specifically because headless Chromium's own sandbox needs
    # unprivileged user namespaces, which GitHub's ubuntu-latest image
    # blocks via AppArmor ("No usable sandbox!") - but WasmRunAlone.cs's
    # --no-sandbox auto-detection (Linux + CI env var) is now a real,
    # already-CI-verified fix for that (test-packed-wasm-tool proved it
    # works on this exact runner image before this job ever needed it).
    # Real sandboxed-Chromium coverage isn't lost by this move - it just
    # shifts to test-packed-tool/test-packed-wasm-tool below, which pick
    # up macos-latest instead - so both the sandboxed and --no-sandbox
    # code paths still get exercised somewhere in the matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # ~15s here on ubuntu-latest (this job used to run on macos-latest,
      # where the identical command took ~4-6 minutes for reasons that
      # stayed unknown after three separate fix attempts - see this
      # job's own top-of-block comment, and pack's copy of this same
      # step, which still runs on ubuntu-latest and always was this
      # fast).
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # Must come before the solution build below: browser-wasm-runner's own
      # build fails outright unless browser-wasm-runner-host has already been
      # published (see browser-wasm-runner.csproj's CheckBrowserWasmRunnerHostPublished
      # target, and browser-wasm-runner-host's own comment on why this can't be
      # auto-triggered from inside browser-wasm-runner's build instead).
      - name: Publish browser-wasm-runner-host
        run: dotnet publish Runner/Platforms/browser-wasm-runner-host -c Release

      - name: Build
        run: dotnet build AnyUnit.slnx --configuration Release

      # PuppeteerSharp downloads its own headless Chrome on first use
      # (BrowserFetcher, cached after that) - no separate install step
      # the way Playwright's `playwright install` needed.
      # WasmRunAlone.cs auto-applies --no-sandbox under Linux CI
      # (detected via the CI env var) - already confirmed working for
      # real on this exact runner image by test-packed-wasm-tool before
      # this job moved here; no explicit -p flag needed for that.
      - name: Run tests through anyunit-browser-wasm
        shell: bash
        run: .github/scripts/run-tests.sh Runner/Platforms/browser-wasm-runner/bin/Release/net10.0/anyunit-browser-wasm.dll browser-wasm

      # Job Summary suppressed here - see build-and-test's own identical
      # comment on why (convention-summary posts the one consolidated
      # summary instead).
      - name: Verify results match naming convention
        shell: bash
        env:
          ANYUNIT_SKIP_GH_SUMMARY: 'true'
        run: |
          set -e
          dotnet run --project WhoTestsTheTesters/ConventionTestProcessor/ConventionTestProcessor.csproj --configuration Release --no-build -- /tmp/*.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anyunit-results-browser-wasm
          path: /tmp/*.json
          if-no-files-found: warn

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          # MinVer (Directory.Build.props) computes each package's
          # version from git tags - actions/checkout's default shallow
          # clone (fetch-depth 1) doesn't fetch tag history, which would
          # make MinVer fall back to its untagged-build version scheme
          # even on an actual tag push. Full history so it sees the
          # real tag when there is one, and the real commit height
          # otherwise (for the prerelease-version case this job exists
          # for in the first place).
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # Must come before the pack below: browser-wasm-runner's own build (which
      # `dotnet pack` triggers as part of packing it) fails outright
      # unless browser-wasm-runner-host has already been published - see
      # browser-wasm-runner.csproj's CheckBrowserWasmRunnerHostPublished target, and
      # test-browser-wasm's own comment for the same prerequisite.
      - name: Publish browser-wasm-runner-host
        run: dotnet publish Runner/Platforms/browser-wasm-runner-host -c Release

      # Packs every IsPackable=true project (Directory.Build.props: off
      # by default, opt-in per project) - non-packable projects are
      # skipped automatically, nothing to filter here.
      - name: Pack
        run: dotnet pack AnyUnit.slnx --configuration Release -o packages

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: packages/*.nupkg

  # Every other job runs AnyUnit's own code straight from source
  # (ProjectReference) - this is the one job that actually installs the
  # packed AnyUnit.Runner nupkg itself (`pack`'s own output, not
  # source), the same way a real consumer would: `dotnet tool install`
  # against the local feed, then the resulting `anyunit-runner` command
  # on PATH, catching a packaging mistake (a file missing from the
  # nupkg, a bad PackAsTool/ToolCommandName setting, ...) that a
  # ProjectReference-based job would never see, since it never touches
  # the packed artifact at all. Verified locally before writing this
  # job: `dotnet tool install --global AnyUnit.Runner --add-source
  # <packed dir> --version <version>` followed by a real `anyunit-runner
  # run` against a built self-test assembly, both worked end to end.
  test-packed-tool:
    needs: pack
    # macos-latest, not ubuntu-latest: no wasm-tools install or browser
    # work happens in this job at all (it only installs the already-
    # packed anyunit-runner tool), so macOS carries none of the slow-
    # install penalty that moved test-browser-wasm off it. Running here
    # instead of ubuntu-latest keeps a non-Linux OS covered in the
    # packed-tool matrix now that test-browser-wasm (below-linked jobs)
    # has vacated macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: packages

      # The self-test assemblies themselves are still built from source
      # (ProjectReference) - only the runner that executes them is the
      # packed one below. Same build-and-test does; AnyUnit.ci.slnf
      # excludes browser-wasm-runner/browser-wasm-runner-host (see
      # top-of-file comment), neither of which this job needs anyway.
      - name: Build self-test payload assemblies
        run: dotnet build AnyUnit.ci.slnf --configuration Release

      # AnyUnit.Runner.Bootstrap also ships as a nupkg (AnyUnit.Runner.Bootstrap.*),
      # but it's a library a consumer references at build time, not
      # something installed - "AnyUnit.Runner.[0-9]*" (a digit right
      # after the second dot) is what picks the CLI tool's own
      # AnyUnit.Runner.<version>.nupkg out from beside it without
      # matching AnyUnit.Runner.Bootstrap.<version>.nupkg too.
      - name: Install the packed anyunit-runner tool from the local feed
        run: |
          set -e
          version=$(ls packages/AnyUnit.Runner.[0-9]*.nupkg | head -1 | sed -E 's#.*/AnyUnit\.Runner\.##; s/\.nupkg$//')
          echo "Installing AnyUnit.Runner $version"
          dotnet tool install --global AnyUnit.Runner --add-source packages --version "$version"

      # packed-tool platform-suffix: this job runs on macos-latest, same
      # OS/arch/framework as build-and-test's own from-source net10 leg -
      # without it, both would report the identical auto-detected
      # PlatformId ("net10-osx-arm64") despite being genuinely different
      # (a packed nuget tool install vs a plain ProjectReference build).
      - name: Run tests through the installed anyunit-runner tool
        shell: bash
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          .github/scripts/run-tests.sh anyunit-runner packed-tool packed-tool

      # Job Summary suppressed here - see build-and-test's own identical
      # comment on why (convention-summary posts the one consolidated
      # summary instead).
      - name: Verify results match naming convention
        shell: bash
        env:
          ANYUNIT_SKIP_GH_SUMMARY: 'true'
        run: |
          set -e
          dotnet run --project WhoTestsTheTesters/ConventionTestProcessor/ConventionTestProcessor.csproj --configuration Release --no-build -- /tmp/*.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anyunit-results-packed-tool
          path: /tmp/*.json
          if-no-files-found: warn

  # BasicTests as a browser-wasm build with an MTP entry point, run under
  # bun - no browser at all. The other wasm leg (test-browser-wasm) needs
  # anyunit-browser-wasm's real Blazor host and headless Chrome; this one
  # is dotnet.js booting a plain console Main because the JS host isn't
  # a browser, which is how BootstrapTests.Wasm has always worked, now
  # with Microsoft.Testing.Platform's own pipeline on top. See
  # BasicTests.Wasm.Mtp.csproj. bun rather than node only because it is
  # the faster install; runtests.mjs works under either.
  test-wasm-mtp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: oven-sh/setup-bun@v2

      # A plain build is enough for a runnable wwwroot/_framework/ (no
      # publish) - see browser-wasm-runner-host/Readme.md. The
      # ConventionTestProcessor build is for the gate below.
      - name: Build
        run: |
          dotnet build WhoTestsTheTesters/Tests/BasicTests.Wasm.Mtp --configuration Release
          dotnet build WhoTestsTheTesters/Tests/Style/FsUnitTests.Wasm.Mtp --configuration Release
          dotnet build WhoTestsTheTesters/ConventionTestProcessor --configuration Release

      # --platform-suffix mtp, the same label run-mtp-tests.sh gives the
      # desktop MTP legs, so this reports net10-browser-wasm-mtp next to
      # test-browser-wasm's net10-browser-wasm. Same "exit code is not
      # the signal" contract as every other leg (BasicTests deliberately
      # fails); runtests.mjs itself fails if no results file came out of
      # the virtual filesystem, and the gate needs the file regardless.
      - name: Run through MTP under bun
        shell: bash
        run: |
          (cd WhoTestsTheTesters/Tests/BasicTests.Wasm.Mtp/bin/Release/net10.0-browser/wwwroot \
            && bun runtests.mjs --report-anyunit-json /tmp/BasicTests-wasm-mtp.json --platform-suffix mtp) || true
          test -f /tmp/BasicTests-wasm-mtp.json
          # The F# one runs through AnyUnit.TestingPlatform.WasmEntry (its
          # harness names it as the main assembly) - see that csproj.
          (cd WhoTestsTheTesters/Tests/Style/FsUnitTests.Wasm.Mtp/bin/Release/net10.0-browser/wwwroot \
            && bun runtests.mjs --report-anyunit-json /tmp/FsUnitTests-wasm-mtp.json --platform-suffix mtp) || true
          test -f /tmp/FsUnitTests-wasm-mtp.json

      - name: Verify results match naming convention
        shell: bash
        env:
          ANYUNIT_SKIP_GH_SUMMARY: 'true'
        run: |
          set -e
          dotnet run --project WhoTestsTheTesters/ConventionTestProcessor/ConventionTestProcessor.csproj --configuration Release --no-build -- /tmp/*.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anyunit-results-wasm-mtp
          path: /tmp/*.json
          if-no-files-found: warn

  # BasicTests.Mtp published as a Native AOT executable and run as one.
  # Every other leg - the self-contained single-file RID publishes in
  # build-and-test included - still JIT-compiles managed code at run time,
  # so none of them ever exercises what ILC's trimming does to AnyUnit's
  # reflection-driven discovery (Assembly.GetTypes(), attribute walks,
  # MethodInfo.Invoke, Task<T>.Result read by name). With MTP the test
  # assembly IS the executable, which makes it the one shape where the
  # framework itself gets compiled ahead of time - and the shape a real
  # consumer wanting AOT tests would use. Two things this leg found the
  # first time it ran locally, both now fixed on the source side and both
  # of which would otherwise have shipped: unrooted test types are trimmed
  # to zero discovered tests (AnyUnit.TestingPlatform.targets now emits
  # TrimmerRootAssembly for the test assembly), and Task<T>.get_Result was
  # trimmed so every async test errored (AsyncTestResult.TaskValue now
  # carries a DynamicDependency).
  #
  # One OS, ubuntu-latest: the AOT toolchain needs a native linker
  # (clang here; MSVC on Windows), the image has it, and what ILC does to
  # the IL is the same on every host - same "same information three times
  # over" reasoning as the coverage job. IlcTreatWarningsAsErrors=false
  # for the one site AnyUnit cannot make trim-clean yet:
  # AsyncTestResult.FSharpAsyncToTask (Assembly.GetType by name plus
  # MakeGenericMethod - IL2026/IL2060/IL2075/IL3050), the F# Async<'T>
  # bridge; every other reflection site carries an
  # UnconditionalSuppressMessage justified by the TrimmerRootAssembly
  # (see AnyUnit/Util/TrimmerAttributes.cs). Directory.Build.props makes
  # warnings errors everywhere, and this is the ILC-only knob, so the C#
  # compiler's own warnings-as-errors still applies to this publish.
  # Resolving that F# site and dropping the flag is the follow-up.
  # AnyUnitPublishAot rather than a global PublishAot - see
  # BasicTests.Mtp.csproj for why.
  test-aot-mtp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish BasicTests.Mtp as Native AOT
        run: |
          dotnet publish WhoTestsTheTesters/Tests/BasicTests.Mtp --configuration Release -r linux-x64 \
            -p:AnyUnitPublishAot=true -p:IlcTreatWarningsAsErrors=false -o publish/aot
          test -x publish/aot/BasicTests
          # A real native image, not a managed app under an apphost: the
          # AOT publish leaves no BasicTests.dll beside the executable.
          test ! -f publish/aot/BasicTests.dll

      # --platform-suffix aot-mtp, so this reports net10-linux-x64-aot-mtp
      # next to build-and-test's net10-linux-x64-mtp for the very same
      # assembly on the very same OS - JIT vs AOT is exactly the
      # difference this leg exists to make visible. Same "exit code is not
      # the signal" contract as every other leg (BasicTests deliberately
      # fails), and the same zero-results check run-mtp-tests.sh does: an
      # over-trimmed image would run cleanly and find nothing.
      - name: Run the Native AOT executable through MTP
        shell: bash
        run: |
          rm -f /tmp/BasicTests-aot-mtp.json
          publish/aot/BasicTests --report-anyunit-json /tmp/BasicTests-aot-mtp.json --platform-suffix aot-mtp || true
          if [ ! -f /tmp/BasicTests-aot-mtp.json ]; then
            echo "the Native AOT executable produced no results file" >&2
            exit 1
          fi
          python3 -c '
          import json, sys
          with open(sys.argv[1], encoding="utf-8-sig") as fh:
              doc = json.load(fh)
          count = sum(len(t.get("Results", []))
                      for a in doc.get("Assemblies", [])
                      for f in a.get("Fixtures", [])
                      for t in f.get("Tests", []))
          if count == 0:
              print("the Native AOT executable ran but discovered no tests - the test assembly was trimmed", file=sys.stderr)
              sys.exit(1)
          print(f"{count} results")
          ' /tmp/BasicTests-aot-mtp.json

      - name: Verify results match naming convention
        shell: bash
        env:
          ANYUNIT_SKIP_GH_SUMMARY: 'true'
        run: |
          set -e
          dotnet run --project WhoTestsTheTesters/ConventionTestProcessor/ConventionTestProcessor.csproj --configuration Release -- /tmp/*.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anyunit-results-aot-mtp
          path: /tmp/*.json
          if-no-files-found: warn

  # The third packed-consumer job, for AnyUnit.TestingPlatform - the
  # one package that is neither a tool to install nor a plain library
  # to reference, but MSBuild machinery (EnableAnyUnitRunner) that has
  # to work from inside a nupkg. Every in-repo .Mtp project imports that
  # machinery from source, which is not the same thing: 1.2.0-alpha.0.15
  # shipped with EnableAnyUnitRunner doing nothing at all from the
  # package (an Exe with an empty Main, zero tests) while every
  # from-source leg stayed green. Found by a real third-party consumer,
  # which is one consumer too late. WhoTestsTheTesters/PackedConsumer is
  # a real PackageReference consumer of the packed nupkgs, gated by the
  # same ConventionTestProcessor as everything else.
  test-packed-mtp:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: packages

      # The consumer project is outside every solution/filter on purpose
      # (see its own comment) - its packages only exist here, at the
      # version the pack job computed. "AnyUnit.TestingPlatform.[0-9]*"
      # picks out the version the same way test-packed-tool's step does.
      - name: Build the packed-package consumer against the local feed
        shell: bash
        run: |
          set -e
          version=$(ls packages/AnyUnit.TestingPlatform.[0-9]*.nupkg | head -1 | sed -E 's#.*/AnyUnit\.TestingPlatform\.##; s/\.nupkg$//')
          echo "Consuming AnyUnit packages $version"
          dotnet build WhoTestsTheTesters/PackedConsumer --configuration Release \
            -p:AnyUnitPackageVersion="$version" \
            -p:RestoreAdditionalProjectSources="$PWD/packages"

      # --platform-suffix: without it this reports the identical
      # "net10-linux-x64" as build-and-test's own ubuntu-latest
      # FsUnitTests run and the two would collapse into one column
      # of the merged report - see test-packed-tool's own identical
      # comment. Same "exit code is not the signal" contract as every
      # other leg: FsUnitTests deliberately contains _Fail cases.
      - name: Run the consumer through its generated MTP entry point
        shell: bash
        run: |
          rm -f /tmp/FsUnitTests-packed-mtp.json
          dotnet WhoTestsTheTesters/PackedConsumer/bin/Release/net10.0/FsUnitTests.dll \
            --report-anyunit-json /tmp/FsUnitTests-packed-mtp.json \
            --platform-suffix packed-mtp || true
          if [ ! -f /tmp/FsUnitTests-packed-mtp.json ]; then
            echo "packed consumer produced no results file - EnableAnyUnitRunner did not take effect from the nupkg" >&2
            exit 1
          fi

      # Built from source here only to run the gate; nothing from the
      # ci.slnf feeds the consumer above.
      - name: Verify results match naming convention
        shell: bash
        env:
          ANYUNIT_SKIP_GH_SUMMARY: 'true'
        run: |
          set -e
          dotnet run --project WhoTestsTheTesters/ConventionTestProcessor/ConventionTestProcessor.csproj --configuration Release -- /tmp/*.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anyunit-results-packed-mtp
          path: /tmp/*.json
          if-no-files-found: warn

  # Same idea as test-packed-tool, for AnyUnit.Runner.BrowserWasm
  # (anyunit-browser-wasm) - arguably the more important of the two to
  # cover this way: its own packed wwwroot content (browser-wasm-runner-host's
  # published output, embedded as pack content under
  # tools/$(TargetFramework)/any/browser-wasm-host/wwwroot/) has already gone
  # silently empty in a real `dotnet pack` once this session (see
  # browser-wasm-runner.csproj's own CheckBrowserWasmRunnerHostPublished
  # comment) - a bug an unpacked/ProjectReference-based job would never
  # have caught, and exactly the class of bug this job exists to catch
  # for real, on a real installed copy, going forward. No wasm-tools
  # workload install or browser-wasm-runner-host publish needed here -
  # unlike test-browser-wasm, which builds+runs from source, this job
  # only ever touches the already-packed .nupkg from the `pack` job.
  test-packed-wasm-tool:
    needs: pack
    # macos-latest, now alongside test-packed-tool above: this job
    # doesn't install wasm-tools or publish browser-wasm-runner-host
    # itself (it only installs the already-packed anyunit-browser-wasm
    # tool, which embeds that pipeline's output as pack content), so it
    # carries none of the slow-workload-install penalty that motivated
    # moving test-browser-wasm to ubuntu-latest. Running the actual
    # headless-Chromium test execution here instead keeps real sandboxed-
    # Chromium coverage in the matrix (no --no-sandbox needed - macOS
    # has no AppArmor-style restriction) now that test-browser-wasm
    # covers the --no-sandbox/Linux-CI-detected code path instead - see
    # its own comment. Between the two jobs, both code paths in
    # WasmRunAlone.cs's sandbox handling stay exercised for real.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: packages

      # AnyUnit.ci.slnf (not the full AnyUnit.slnx) - same reasoning as
      # test-packed-tool: only the self-test payload assemblies need
      # building from source here, and ci.slnf is specifically the
      # filter that excludes browser-wasm-runner/browser-wasm-runner-host
      # (which this job has no use for - it never builds that pair from
      # source at all, only installs its already-packed output).
      - name: Build self-test payload assemblies
        run: dotnet build AnyUnit.ci.slnf --configuration Release

      # "AnyUnit.Runner.BrowserWasm.[0-9]*" (a digit right after the
      # third dot) picks this tool's own
      # AnyUnit.Runner.BrowserWasm.<version>.nupkg out from beside
      # AnyUnit.Runner.<version>.nupkg/AnyUnit.Runner.Bootstrap.<version>.nupkg,
      # same reasoning as test-packed-tool's own version-extraction step.
      - name: Install the packed anyunit-browser-wasm tool from the local feed
        run: |
          set -e
          version=$(ls packages/AnyUnit.Runner.BrowserWasm.[0-9]*.nupkg | head -1 | sed -E 's#.*/AnyUnit\.Runner\.BrowserWasm\.##; s/\.nupkg$//')
          echo "Installing AnyUnit.Runner.BrowserWasm $version"
          dotnet tool install --global AnyUnit.Runner.BrowserWasm --add-source packages --version "$version"

      # PuppeteerSharp downloads its own headless Chrome on first use
      # (BrowserFetcher, cached after that) - same as test-browser-wasm.
      # packed-wasm-tool platform-suffix: the actual test execution runs
      # inside the browser-wasm interpreter regardless of which OS
      # launched it, so this would otherwise report the exact same
      # PlatformId ("net10-browser-wasm") as test-browser-wasm's own
      # from-source run - see test-packed-tool's own identical comment.
      - name: Run tests through the installed anyunit-browser-wasm tool
        shell: bash
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          .github/scripts/run-tests.sh anyunit-browser-wasm packed-wasm-tool packed-wasm-tool

      # Job Summary suppressed here - see build-and-test's own identical
      # comment on why (convention-summary posts the one consolidated
      # summary instead).
      - name: Verify results match naming convention
        shell: bash
        env:
          ANYUNIT_SKIP_GH_SUMMARY: 'true'
        run: |
          set -e
          dotnet run --project WhoTestsTheTesters/ConventionTestProcessor/ConventionTestProcessor.csproj --configuration Release --no-build -- /tmp/*.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anyunit-results-packed-wasm-tool
          path: /tmp/*.json
          if-no-files-found: warn

  # Same idea as test-packed-tool, for AnyUnit.Report (anyunit-report):
  # installs the real packed nupkg, then converts a real results.json
  # (produced by the from-source net10-runner, built here via
  # AnyUnit.ci.slnf same as test-packed-tool does) to every supported
  # format, checking each output actually parses as well-formed
  # XML/JSON - the shape a consumer of the packed tool would get, not
  # just what building AnyUnit.Report from source produces.
  test-packed-report-tool:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: packages

      - name: Build self-test payload assemblies and net10-runner
        run: dotnet build AnyUnit.ci.slnf --configuration Release

      # BasicTests always contains real Fail/Error cases by design (see
      # run-tests.sh's own comment) - the runner's non-zero exit is
      # expected here too, only the output file's existence matters.
      - name: Produce a real results.json via the from-source net10-runner
        run: |
          set -e
          dotnet Runner/Platforms/net10/bin/Release/net10.0/anyunit-runner.dll run \
            -o /tmp/BasicTests.json \
            WhoTestsTheTesters/Tests/BasicTests/bin/Release/netstandard2.0/BasicTests.dll || true
          test -f /tmp/BasicTests.json

      - name: Install the packed anyunit-report tool from the local feed
        run: |
          set -e
          version=$(ls packages/AnyUnit.Report.[0-9]*.nupkg | head -1 | sed -E 's#.*/AnyUnit\.Report\.##; s/\.nupkg$//')
          echo "Installing AnyUnit.Report $version"
          dotnet tool install --global AnyUnit.Report --add-source packages --version "$version"

      - name: Convert to every supported format through the installed anyunit-report tool
        shell: bash
        run: |
          set -e
          export PATH="$PATH:$HOME/.dotnet/tools"
          for fmt_ext in junit:xml trx:xml nunit:xml xunit:xml ctrf:json html:html markdown:md; do
            fmt="${fmt_ext%%:*}"
            ext="${fmt_ext##*:}"
            anyunit-report convert -f "$fmt" -o "/tmp/BasicTests.$fmt.$ext" /tmp/BasicTests.json
          done

      - name: Verify each output is well-formed
        shell: bash
        run: |
          set -e
          for f in /tmp/BasicTests.junit.xml /tmp/BasicTests.trx.xml /tmp/BasicTests.nunit.xml /tmp/BasicTests.xunit.xml; do
            python3 -c "import xml.etree.ElementTree as ET; ET.parse('$f')"
          done
          python3 -c "import json; json.load(open('/tmp/BasicTests.ctrf.json'))"
          # Not XML-parsed: the HTML writer emits HTML5, not XHTML (void
          # elements like <meta>/<input> are unclosed), so ET.parse would
          # reject a perfectly valid document. html.parser instead, with
          # an explicit unclosed-tag check - that's the failure mode worth
          # catching here (a writer that forgets a </div> still "parses").
          python3 - <<'PY'
          from html.parser import HTMLParser
          void = {'meta','br','hr','img','input','link','source','col'}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
              def handle_starttag(self, tag, attrs):
                  if tag not in void: self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag in void: return
                  assert self.stack, f'unexpected </{tag}>'
                  assert self.stack[-1] == tag, f'</{tag}> closes <{self.stack[-1]}>'
                  self.stack.pop()
          p = P()
          p.feed(open('/tmp/BasicTests.html.html', encoding='utf-8').read())
          assert not p.stack, f'unclosed tags: {p.stack}'
          PY
          # The markdown summary's own hard requirement is that it fits in
          # a job summary - over 1 MiB the upload fails with an annotation
          # while the job still reports success, i.e. it would silently
          # stop appearing rather than fail loudly here. Also check its
          # <details> are balanced: truncation rewinding to the wrong place
          # would leave a dangling one that swallows the rest of the post.
          python3 - <<'PY'
          md = open('/tmp/BasicTests.markdown.md', encoding='utf-8').read()
          size = len(md.encode('utf-8'))
          assert size < 1024 * 1024, f'markdown summary is {size} bytes, over the 1 MiB job-summary limit'
          assert md.count('<details>') == md.count('</details>'), 'unbalanced <details> in markdown summary'
          print(f'markdown summary: {size} bytes, {md.count("<details>")} detail blocks')
          PY

  # A consolidated, cross-platform view on top of (not instead of) every
  # job above's own fail-fast convention gate: those stay the real,
  # job-local pass/fail signal (fails immediately, attributes clearly to
  # one specific OS/leg in the Checks UI) - this job exists purely to
  # answer "what does the FULL platform matrix look like in one place",
  # which no single job above can see on its own. if: always() so it
  # still runs (and still posts its summary) even when one of those jobs
  # failed - the consolidated view should show that failure too, not skip
  # itself right when it would be most useful.
  #
  # No merge tooling needed: ConventionTestProcessor.VerifyJsonResults
  # already accepts more than one results.json in a single call and
  # accumulates them into the same Correct/Invalid/Unknown lists - which
  # is exactly why every job above already passes it a whole /tmp/*.json
  # glob instead of one file at a time. Passing it every downloaded
  # artifact's *.json here is the identical mechanism, just pointed at
  # every platform's files instead of one job's own.
  convention-summary:
    needs: [build-and-test, test-browser-wasm, test-wasm-mtp, test-aot-mtp, test-packed-tool, test-packed-wasm-tool, test-packed-mtp, pack]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build ConventionTestProcessor
        run: dotnet build WhoTestsTheTesters/ConventionTestProcessor/ConventionTestProcessor.csproj --configuration Release

      # pack's own AnyUnit.Report.<version>.nupkg - the same packed tool a
      # real consumer would install, not a source build, same reasoning as
      # test-packed-tool's own packed-vs-source distinction.
      - name: Download packed nuget packages
        uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: packages

      # Each anyunit-results-* artifact (build-and-test's 6-OS matrix,
      # test-browser-wasm, test-wasm-mtp, test-aot-mtp, test-packed-tool,
      # test-packed-wasm-tool, test-packed-mtp) into
      # its own subdirectory under all-results/, NOT merge-multiple's
      # flattened single directory: run-tests.sh's own suffix argument
      # ("net10") is the same literal string across every build-and-test
      # matrix leg regardless of OS, so every leg's artifact contains a
      # same-named BasicTests-net10.json/etc. - merge-multiple flattening
      # those into one shared directory collides them across artifacts
      # (confirmed for real: silently produced a corrupted/truncated file,
      # ConventionTestProcessor crashing on it with a JsonException, not a
      # clean file-not-found). One subdirectory per artifact (the default
      # when merge-multiple isn't set) sidesteps the collision entirely,
      # at the cost of a one-level-deeper glob below. coverage's own
      # results.json is deliberately not part of any of this (it re-runs
      # the identical net10 self-test data purely to measure coverage %,
      # not a distinct platform - see GitHubSummary.cs's own
      # ANYUNIT_SKIP_GH_SUMMARY comment for the same reasoning).
      - name: Download every platform's results
        uses: actions/download-artifact@v7
        with:
          pattern: anyunit-results-*
          path: all-results

      - name: Verify results match naming convention across every platform
        shell: bash
        run: |
          set -e
          dotnet run --project WhoTestsTheTesters/ConventionTestProcessor/ConventionTestProcessor.csproj --configuration Release --no-build -- all-results/*/*.json

      # if: always() from here down - want the HTML report even when the
      # gate above just failed (that's exactly when a human most wants to
      # look at the actual per-test detail), same reasoning as build-and-
      # test's own "Upload results" step.
      #
      # "AnyUnit.Report.[0-9]*" (a digit right after the second dot) picks
      # this tool's own nupkg out from beside AnyUnit.Report.Sdk or
      # similar, same pattern as test-packed-tool's version-extraction
      # step. The packed tool, not a source build - same real-consumer
      # reasoning as test-packed-tool's own packed-vs-source distinction.
      #
      # No third-party HTML tool any more: anyunit-report grew its own
      # `-f html` writer (Report/Formats/HtmlWriter.cs). Two were tried
      # through a TRX hand-off first and both were a poor fit for this
      # repo's multi-platform output - PrettyTRX mislabeled every result
      # under one blanket assembly group, and TrxToExtentReport, while
      # correct, can only show what TRX can express: the same test under
      # 18 platforms as 18 unrelated-looking "TestName [platform]" rows,
      # because TRX has no concept of one test having N platform results.
      # The first-party writer keeps platform as an axis (a test x
      # platform matrix) instead of flattening it away.
      - name: Install the packed anyunit-report tool
        if: always()
        run: |
          set -e
          version=$(ls packages/AnyUnit.Report.[0-9]*.nupkg | head -1 | sed -E 's#.*/AnyUnit\.Report\.##; s/\.nupkg$//')
          echo "Installing AnyUnit.Report $version"
          dotnet tool install --global AnyUnit.Report --add-source packages --version "$version"

      # One self-contained HTML file (inline CSS/JS, no external refs) so
      # it works straight out of the downloaded artifact zip over file://.
      # HTML only, deliberately: a .trx was uploaded alongside it briefly
      # on the theory that a machine-readable copy might be wanted, but
      # nothing consumes it - and it was by far the bigger half of the
      # artifact (7.7MB of TRX against a 2.8MB report). The raw per-
      # platform results.json artifacts are still uploaded by every job
      # above if anything ever does need to consume a run mechanically.
      - name: Generate merged HTML test report
        if: always()
        shell: bash
        run: |
          set -e
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p html-report
          anyunit-report convert -f html -o html-report/report.html all-results/*/*.json
          ls -la html-report

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-html
          path: html-report/report.html
          if-no-files-found: warn
