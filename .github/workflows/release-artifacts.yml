# Builds self-contained, single-file, RID-suffixed anyunit-runner
# executables for every RID that makes sense as a release download, and
# uploads them all as both workflow artifacts and (create-release, once
# every RID job succeeds) real GitHub Release assets. NuGet packing
# itself still happens in build.yml, on every push (not just a release
# tag, specifically so prerelease packages are always available to grab
# and test without needing to cut a release first) - publish-nuget below
# pushes THAT SAME job's own nupkg artifact to nuget.org, rather than
# packing a second time here, so what actually gets published is
# guaranteed to be the exact bits build.yml's pack job produced and its
# own test-packed-tool/test-packed-wasm-tool jobs already installed and
# ran for real - not a second, separately-produced (if in practice
# almost certainly identical) set of nupkgs that never went through
# either. publish-nuget also attaches the two packed CLI tools'
# nupkgs (AnyUnit.Runner/AnyUnit.Runner.BrowserWasm - not every library
# package, just the ones a person would actually want to grab directly
# off a Release page rather than restore via PackageReference) to that
# same Release, for the same reason: a real download link straight to
# the exact tested bits, not just something on nuget.org.
#
# publish-nuget uses nuget.org's Trusted Publishing (OIDC): no long-lived
# API key stored as a secret, just NUGET_USER (a plain username, not a
# credential) - see that job's own comment. Requires a Trusted Publishing
# policy already configured on nuget.org for this exact repo/workflow
# file (jbtule/AnyUnit, release-artifacts.yml).
#
# Every RID cross-compiles fine from any host (the .NET SDK downloads the
# target runtime pack via NuGet regardless of the host's own arch -
# verified locally: all 8 of these RIDs publish correctly from a single
# macOS arm64 dev machine). So cross-compiling everything from one host
# per OS would technically work - but each OS gets a real x64 host and a
# real arm64 host below instead (same split already used in build.yml's
# test matrix), so the arm64 RIDs are genuinely built on arm64 hardware
# rather than cross-compiled, matching the value of running the actual
# per-arch tests there. A RID with no hosted runner of its own (win-x86,
# linux-arm - both 32-bit) rides along on its 64-bit counterpart's host,
# per the user's own call that 32-bit hosts aren't needed.
#
# Deliberately NOT trimmed (PublishTrimmed) even though these are
# self-contained: anyunit-runner loads test assemblies - and whatever
# they transitively reference - via reflection at runtime
# (Assembly.LoadFrom, see shared/RunTests.cs), which is exactly the
# pattern the IL trimmer can't see through and routinely strips as
# "unused". Self-contained-but-untrimmed is a bigger download than
# trimmed would be, but trimmed risks silently broken test-assembly
# loading, which is worse.
name: release-artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  # publish-nuget's own trigger - see that job's comment for why it
  # runs off build.yml's completion instead of push/workflow_dispatch
  # like every other job here. Read from this file's copy on the
  # default branch by GitHub itself (a workflow_run trigger always is,
  # regardless of what's in the tag being released) - this has to be on
  # master before it'll actually fire for a future tag.
  workflow_run:
    workflows: [build]
    types: [completed]

jobs:
  # Every job below except publish-nuget only cares about an actual
  # release trigger (push/workflow_dispatch), not the workflow_run
  # completion event this file now also listens for - guarded so they
  # don't try to run a second time (with no matching tag context) when
  # build.yml finishes.
  publish-windows-x64:
    if: github.event_name != 'workflow_run'
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish anyunit-runner (${{ matrix.rid }})
        run: |
          dotnet publish Runner/Platforms/net10/net10-runner.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish/${{ matrix.rid }}
      - name: Rename with RID
        shell: bash
        run: mv "publish/${{ matrix.rid }}/anyunit-runner.exe" "publish/${{ matrix.rid }}/anyunit-runner-${{ matrix.rid }}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: anyunit-runner-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/anyunit-runner-${{ matrix.rid }}.exe

  publish-windows-arm64:
    if: github.event_name != 'workflow_run'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish anyunit-runner (win-arm64)
        run: |
          dotnet publish Runner/Platforms/net10/net10-runner.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -o publish/win-arm64
      - name: Rename with RID
        shell: bash
        run: mv "publish/win-arm64/anyunit-runner.exe" "publish/win-arm64/anyunit-runner-win-arm64.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: anyunit-runner-win-arm64
          path: publish/win-arm64/anyunit-runner-win-arm64.exe

  publish-linux-x64:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish anyunit-runner (linux-x64)
        run: |
          dotnet publish Runner/Platforms/net10/net10-runner.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/linux-x64
      - name: Rename with RID
        run: mv "publish/linux-x64/anyunit-runner" "publish/linux-x64/anyunit-runner-linux-x64"
      - uses: actions/upload-artifact@v7
        with:
          name: anyunit-runner-linux-x64
          path: publish/linux-x64/anyunit-runner-linux-x64

  publish-linux-arm64:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        # linux-arm (32-bit) has no hosted runner of its own - its 64-bit
        # counterpart is arm64, not x64, so it rides along here rather
        # than on publish-linux-x64.
        rid: [linux-arm64, linux-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish anyunit-runner (${{ matrix.rid }})
        run: |
          dotnet publish Runner/Platforms/net10/net10-runner.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish/${{ matrix.rid }}
      - name: Rename with RID
        run: mv "publish/${{ matrix.rid }}/anyunit-runner" "publish/${{ matrix.rid }}/anyunit-runner-${{ matrix.rid }}"
      - uses: actions/upload-artifact@v7
        with:
          name: anyunit-runner-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/anyunit-runner-${{ matrix.rid }}

  publish-macos-arm64:
    if: github.event_name != 'workflow_run'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish anyunit-runner (osx-arm64)
        run: |
          dotnet publish Runner/Platforms/net10/net10-runner.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -o publish/osx-arm64
      - name: Rename with RID
        run: mv "publish/osx-arm64/anyunit-runner" "publish/osx-arm64/anyunit-runner-osx-arm64"
      - uses: actions/upload-artifact@v7
        with:
          name: anyunit-runner-osx-arm64
          path: publish/osx-arm64/anyunit-runner-osx-arm64

  publish-macos-x64:
    if: github.event_name != 'workflow_run'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish anyunit-runner (osx-x64)
        run: |
          dotnet publish Runner/Platforms/net10/net10-runner.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -o publish/osx-x64
      - name: Rename with RID
        run: mv "publish/osx-x64/anyunit-runner" "publish/osx-x64/anyunit-runner-osx-x64"
      - uses: actions/upload-artifact@v7
        with:
          name: anyunit-runner-osx-x64
          path: publish/osx-x64/anyunit-runner-osx-x64

  # The net48 runners, which the Release page was missing entirely.
  #
  # `dotnet build -p:Platform=`, not the `dotnet publish -r <rid>
  # --self-contained -p:PublishSingleFile=true` every job above uses:
  # classic .NET Framework has no RuntimeIdentifier/self-contained
  # deployment model at all, and bitness is a PE-header PlatformTarget
  # needing one build per variant (see net48-runner.csproj's own
  # comment). These are still single self-contained .exe files like every
  # other asset here, just by a different mechanism - the csproj embeds
  # the dependencies as a zip resource (see its EmbedDependencies target
  # and DiminishedProgram.cs), so the build output is the .exe alone and
  # there is nothing extra to attach.
  #
  # windows-latest even though the build itself is portable (net48 output
  # is plain IL and builds fine on Linux/macOS): .NET Framework only RUNS
  # on Windows, and every other job here likewise publishes on the OS it
  # targets.
  publish-net48:
    if: github.event_name != 'workflow_run'
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x86
            name: win32
          - platform: x64
            name: win64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build net48 runner (${{ matrix.platform }})
        run: dotnet build Runner/Platforms/net48/net48-runner.csproj -c Release -p:Platform=${{ matrix.platform }}
      # Named anyunit-runner-* so create-release's existing
      # `pattern: anyunit-runner-*` download picks these up with
      # everything else - that's the artifact name, not the file inside
      # it, which keeps the net48-specific name the csproj gives it.
      - uses: actions/upload-artifact@v7
        with:
          name: anyunit-runner-net48-${{ matrix.name }}
          path: Runner/Platforms/net48/bin/${{ matrix.platform }}/Release/net48/anyunit-net48-runner-${{ matrix.name }}.exe

  # Creates (or reuses, if it already exists - see below) the GitHub
  # Release for this tag and attaches every RID executable to it.
  # workflow_dispatch is excluded here (github.event_name != 'workflow_run'
  # is the SAME guard every RID job above uses, but this job additionally
  # needs an actual tag to create a release for, which a manual
  # workflow_dispatch run may not have): only a real tag push creates/
  # updates a release.
  #
  # `gh release view` first, create only if missing, rather than always
  # `gh release create`: publish-nuget (a separate, workflow_run-
  # triggered job below) may run before or after this one with no
  # ordering guarantee between them (two independently-triggered flows
  # off the same tag push - see that job's own comment), and whichever
  # runs second needs to attach its own assets to a release the other
  # one may have already created, not fail on "already exists".
  create-release:
    if: github.event_name != 'workflow_run'
    needs:
      - publish-windows-x64
      - publish-windows-arm64
      - publish-linux-x64
      - publish-linux-arm64
      - publish-macos-arm64
      - publish-macos-x64
      - publish-net48
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # pattern+merge-multiple: every publish-<os> job above uploaded
      # its own RID executable(s) under its own artifact name
      # (anyunit-runner-<rid>) - this pulls all of them into one flat
      # directory instead of one subfolder per artifact.
      - name: Download every RID executable
        uses: actions/download-artifact@v7
        with:
          pattern: anyunit-runner-*
          path: release-assets
          merge-multiple: true

      - name: Create the release (if it doesn't already exist) and upload RID executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" --repo "${{ github.repository }}" --clobber release-assets/*

  # Pushes build.yml's own already-packed, already-installed-and-run
  # nuget-packages artifact to nuget.org, once that workflow run
  # finishes - not a repack. Triggered by workflow_run rather than the
  # push/workflow_dispatch every other job here uses, specifically so it
  # can download that OTHER workflow's artifact (actions/download-
  # artifact's run-id input needs an actual run to point at; there's no
  # such run yet at the moment this workflow's own push-triggered jobs
  # start, since build.yml is a separate, independently-triggered
  # workflow off the same tag push, not something this workflow's run
  # can `needs:` across).
  #
  # Trusted Publishing (OIDC) instead of a stored API key: this job
  # requests a GitHub OIDC token (id-token: write), NuGet/login
  # exchanges it with nuget.org for a temporary (1-hour) API key, and
  # that key is what actually pushes. NUGET_USER is just this account's
  # nuget.org profile name, not a secret in the credential sense - it's
  # a repo secret only so it isn't hardcoded, not because it needs to
  # stay confidential.
  #
  # Gated to: build.yml's own run actually succeeded (a failed build
  # obviously shouldn't get its packages pushed), and that run was
  # itself for a real TAG.
  #
  # That second half used to be `startsWith(head_branch, 'v')`, with a
  # comment asserting head_branch "is the tag name itself for a
  # tag-triggered run". Only half true, and the wrong half: on a
  # tag-triggered run it is indeed the tag, but on a BRANCH push it is
  # the branch name - and the expression cannot tell the two apart. A
  # branch named `v1.2-housekeeping` therefore satisfied it, and merging
  # that branch published every package to nuget.org and created a
  # GitHub Release named after the branch. That is not hypothetical: it
  # happened, publishing 1.2.0-alpha.0.6 of all eleven packages.
  #
  # head_branch alone cannot distinguish them, so don't ask it to.
  # workflow_run carries the triggering run's own event in
  # `workflow_run.event`, which is 'push' for both - but a tag push
  # reports head_branch as the tag AND leaves the tag resolvable, so the
  # reliable test is to ask git whether that ref actually exists as a
  # tag. Cheap, unambiguous, and it fails closed: anything that is not a
  # real tag simply does not publish.
  publish-nuget:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      # The `if:` above narrows to a pushed ref starting with 'v'; this
      # proves it is a real TAG before anything is published. The job
      # condition cannot do it (no repo checkout, no API call in an
      # expression), so it happens here, first, and fails the job loudly
      # rather than publishing something a branch name talked its way
      # into.
      - name: Verify the triggering ref is a real tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/$REF_NAME" >/dev/null 2>&1; then
            echo "::error::'$REF_NAME' is not a tag in this repository - refusing to publish."
            echo "A branch whose name merely starts with 'v' must never reach nuget.org."
            exit 1
          fi
          echo "Confirmed '$REF_NAME' is a real tag."

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Same repo, so the default GITHUB_TOKEN can read build.yml's own
      # run's artifacts - no PAT needed. run-id pins this to that exact
      # run (the one whose conclusion/head_branch were just checked
      # above), not just "whatever's latest".
      - name: Download build.yml's nuget-packages artifact
        uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: packages
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate: a re-run of this job for a tag that already
      # got some (but maybe not all, on a partial failure) of its
      # packages pushed shouldn't fail outright on the ones that already
      # made it - nuget.org itself rejects re-pushing an existing
      # id+version, this just stops that from failing the whole step.
      - name: Push packages to nuget.org
        shell: bash
        run: |
          set -e
          for pkg in packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      # Just the packed CLI tools, not every library package - a
      # download link straight off the Release page is useful for
      # something a person installs/runs directly (anyunit-runner/
      # anyunit-browser-wasm/anyunit-report), not for a library meant to
      # be restored via PackageReference from nuget.org instead. That's
      # the rule for what belongs here: every PackAsTool project, and
      # only those.
      #
      # That rule is applied by ASKING EACH NUPKG, not by listing the
      # tool ids here. This used to be a hand-maintained glob list
      # (AnyUnit.Runner.[0-9]*, AnyUnit.Runner.BrowserWasm.[0-9]*,
      # AnyUnit.Report.[0-9]*) with digit-anchoring to keep
      # AnyUnit.Runner.<version> from also matching
      # AnyUnit.Runner.Bootstrap.<version> - and it drifted exactly as
      # you'd expect: nuget.org needs no such list (the push step above
      # globs packages/*.nupkg), so AnyUnit.Report reached nuget.org on
      # its own when it was added while silently never appearing on the
      # Release page, because nobody added it HERE too.
      #
      # `dotnet pack` puts a PackAsTool project's payload under tools/
      # in the nupkg (and no library package has that), so the zip's own
      # entries answer "is this a tool?" directly. A new CLI tool now
      # shows up on the Release page by being a tool, with nothing to
      # remember.
      #
      # gh release view/create first, same "don't fail if create-release
      # (a separate, push-triggered job in this same workflow file) got
      # there first, or hasn't yet" reasoning as that job's own comment -
      # there's no ordering guarantee between the two.
      - name: Upload the packed CLI tool nupkgs to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.workflow_run.head_branch }}"

          tools=()
          for pkg in packages/*.nupkg; do
            # Deliberately not `unzip -Z1 ... | grep -q`: under `set -o
            # pipefail`, grep -q exits at the first match, unzip then
            # takes SIGPIPE, and the pipeline reports failure even
            # though the package DID match - silently reclassifying a
            # tool as a library. Command substitution reads unzip's
            # output to completion instead, and `|| true` absorbs
            # grep's exit 1 for the genuine no-match case.
            if [ -n "$(unzip -Z1 "$pkg" | grep '^tools/' || true)" ]; then
              echo "tool:    $pkg"
              tools+=("$pkg")
            else
              echo "library: $pkg (not attached to the Release)"
            fi
          done

          # Loud, not silent: attaching nothing means either the pack
          # artifact didn't download or every tool stopped being one.
          # Both are bugs, and both otherwise look like a green run.
          if [ ${#tools[@]} -eq 0 ]; then
            echo "::error::No PackAsTool nupkgs found in packages/ - expected at least one."
            exit 1
          fi

          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" --repo "${{ github.repository }}" --clobber "${tools[@]}"
